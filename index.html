<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моё Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }
    button {
      padding: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h2>Привет 👋</h2>
<p>Это моё первое Telegram Mini App</p>

<button onclick="sendData()">Отправить данные в бота</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  function sendData() {
    tg.sendData("Привет от Mini App!");
  }
</script>

</body>
</html>
