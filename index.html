<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>True Money</title>
<style>
:root{
--bg:#f4f5f7;--card:#ffffff;--text:#1f2933;--muted:#8b8f97;
--green:#6fae8e;--red:#d38c87;--danger:#c94a44;
--shadow:0 6px 20px rgba(0,0,0,.06)
}
*{box-sizing:border-box}
body{
margin:0;padding:12px 12px 90px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
background:var(--bg);color:var(--text)
}
.header{
display:flex;align-items:center;justify-content:space-between;
margin-bottom:12px
}
.title{font-size:20px;font-weight:600}
.back{font-size:18px;color:var(--muted)}
.switch{
display:flex;background:var(--card);border-radius:16px;
box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px
}
.switch button{
flex:1;padding:12px;border:none;font-weight:600;
background:none;color:var(--muted)
}
.switch button.active{background:#eef1f5;color:var(--text)}
.list{
background:var(--card);border-radius:18px;
box-shadow:var(--shadow);padding:12px
}
.cat-item{
display:flex;align-items:center;justify-content:space-between;
padding:12px 0;border-bottom:1px solid #eee
}
.cat-item:last-child{border-bottom:none}
.left{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%}
.edit{color:#9aa0a6}
.add{
margin-top:14px;padding:14px;
border-radius:18px;border:none;
background:#e5e7eb;font-weight:600
}
.modal{
position:fixed;inset:0;background:rgba(0,0,0,.35);
display:none;justify-content:center;align-items:center
}
.modal-box{
background:var(--card);border-radius:22px;
padding:18px;width:92%;max-width:420px
}
input{
width:100%;padding:14px;border-radius:16px;
border:1px solid #ddd;font-size:16px;margin-top:10px
}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.color{
width:34px;height:34px;border-radius:50%;
border:2px solid transparent
}
.color.active{border-color:#000}
.actions{
margin-top:18px;display:flex;flex-direction:column;
align-items:center;gap:12px
}
.actions button{
width:100%;max-width:260px;padding:14px;
border-radius:20px;border:none;font-weight:600
}
.save{background:var(--green);color:#fff}
.delete{background:var(--danger);color:#fff}
.cancel{background:#e5e7eb}
</style>
</head>
<body>

<div class="header">
<div class="back" onclick="goBack()">←</div>
<div class="title">Категории</div>
<div></div>
</div>

<div class="switch">
<button id="expBtn" class="active" onclick="switchType('expense')">Расходы</button>
<button id="incBtn" onclick="switchType('income')">Доходы</button>
</div>

<div class="list" id="list"></div>
<button class="add" onclick="openNew()">＋ Добавить категорию</button>

<div class="modal" id="modal">
<div class="modal-box">
<h3 id="modalTitle"></h3>
<input id="name" placeholder="Название категории">
<div class="colors" id="colors"></div>
<div class="actions">
<button class="save" onclick="saveCat()">Сохранить</button>
<button class="delete" id="delBtn" onclick="deleteCat()">Удалить</button>
<button class="cancel" onclick="closeModal()">Отмена</button>
</div>
</div>
</div>

<script>
const palette=['#e3a6a1','#d6a5c8','#b7c4e0','#8fc4aa','#87b9cf','#f2c48d','#c3b1e1'];
let categories=JSON.parse(localStorage.getItem('categories'))||{
expense:[
{id:'food',name:'Еда',color:'#e3a6a1',base:true},
{id:'health',name:'Здоровье',color:'#d6a5c8',base:true},
{id:'home',name:'Дом',color:'#b7c4e0',base:true}
],
income:[
{id:'salary',name:'Заработная плата',color:'#8fc4aa',base:true},
{id:'gifts',name:'Подарки',color:'#87b9cf',base:true}
]
};
let currentType='expense',editId=null,chosenColor=null;

function save(){localStorage.setItem('categories',JSON.stringify(categories))}

function render(){
const l=document.getElementById('list');l.innerHTML='';
categories[currentType].forEach(c=>{
const d=document.createElement('div');
d.className='cat-item';
d.innerHTML=`<div class="left">
<div class="dot" style="background:${c.color}"></div>${c.name}
</div>
<div class="edit" onclick="editCat('${c.id}')">✏️</div>`;
l.appendChild(d);
});
}

function switchType(t){
currentType=t;
expBtn.classList.toggle('active',t==='expense');
incBtn.classList.toggle('active',t==='income');
render();
}

function openNew(){
editId=null;name.value='';chosenColor=palette[0];
modalTitle.innerText='Новая категория';
delBtn.style.display='none';
renderColors();
modal.style.display='flex';
}

function editCat(id){
const c=categories[currentType].find(x=>x.id===id);
editId=id;name.value=c.name;chosenColor=c.color;
modalTitle.innerText='Редактировать категорию';
delBtn.style.display=c.base?'none':'block';
renderColors();
modal.style.display='flex';
}

function renderColors(){
colors.innerHTML='';
palette.forEach(p=>{
const d=document.createElement('div');
d.className='color'+(p===chosenColor?' active':'');
d.style.background=p;
d.onclick=()=>{chosenColor=p;renderColors()};
colors.appendChild(d);
});
}

function saveCat(){
if(!name.value.trim())return;
if(editId){
const c=categories[currentType].find(x=>x.id===editId);
c.name=name.value;c.color=chosenColor;
}else{
categories[currentType].push({
id:'cat'+Date.now(),
name:name.value,
color:chosenColor,
base:false
});
}
save();closeModal();render();
}

function deleteCat(){
categories[currentType]=categories[currentType].filter(c=>c.id!==editId);
save();closeModal();render();
}

function closeModal(){modal.style.display='none'}
function goBack(){history.back()}
render();
</script>
</body>
</html>
