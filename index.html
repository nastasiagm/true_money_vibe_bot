<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>True Money</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
--bg:#f6f7f9;--card:#ffffff;--text:#1f2933;--muted:#6b7280;
--income:#7fb69c;--expense:#e3a6a1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
margin:0;padding:14px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
background:var(--bg);color:var(--text)
}
.top{display:flex;justify-content:flex-end;margin-bottom:10px}
.menu{font-size:22px;color:var(--muted)}
.balance{
background:var(--card);border-radius:16px;padding:18px;
text-align:center;font-size:28px;font-weight:600;margin-bottom:16px;
box-shadow:0 4px 14px rgba(0,0,0,.04)
}
.buttons{display:flex;gap:12px;margin-bottom:16px}
button{
padding:14px;font-size:15px;border:none;border-radius:14px;
width:100%;font-weight:500
}
.income{background:var(--income);color:#fff}
.expense{background:var(--expense);color:#fff}
.history{
background:var(--card);border-radius:16px;padding:12px;
box-shadow:0 4px 14px rgba(0,0,0,.04)
}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ececec}
.item:last-child{border-bottom:none}
.row{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
.plus{color:#3f8f6b}.minus{color:#b25550}
.delete{color:#bbb;font-size:18px;padding-left:10px}
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.35);
display:none;justify-content:center;align-items:center;z-index:10
}
.modal{
background:var(--card);border-radius:18px;padding:16px;width:92%;max-width:420px
}
input,textarea{
width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;
margin-top:10px;font-size:15px;font-family:inherit
}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cat{padding:8px 14px;border-radius:20px;color:#fff;font-size:13px;opacity:.6}
.cat.active{opacity:1}
</style>
</head>
<body>

<div class="top"><div class="menu" onclick="openMenu()">⋮</div></div>
<div class="balance">Баланс: <span id="balance">0</span> ₽</div>

<div class="buttons">
<button class="income" onclick="openAdd('income')">Доход</button>
<button class="expense" onclick="openAdd('expense')">Расход</button>
</div>

<div class="history" id="history"><strong>История операций</strong></div>

<div class="overlay" id="menuModal">
<div class="modal">
<button onclick="clearAll()">Удалить все данные</button>
<button onclick="closeMenu()">Отмена</button>
</div>
</div>

<div class="overlay" id="addModal">
<div class="modal">
<h3 id="addTitle"></h3>
<input id="amountInput" type="number" placeholder="Сумма">
<textarea id="commentInput" placeholder="Комментарий (необязательно)"></textarea>
<div class="cats" id="cats"></div>
<button onclick="saveOperation()">Сохранить</button>
<button onclick="closeAdd()">Отмена</button>
</div>
</div>

<script>
const expenseCategories={'Еда':'#f0b8b4','Здоровье':'#e7b0c9','Дом':'#b8c6e6'};
const incomeCategories={'Заработная плата':'#9ac7b3','Подарки':'#8fc4d6'};
let balance=parseFloat(localStorage.getItem('balance'))||0;
let operations=JSON.parse(localStorage.getItem('operations'))||[];
let currentType=null,currentCategory=null;

function save(){localStorage.setItem('balance',balance);localStorage.setItem('operations',JSON.stringify(operations))}

function render(){
document.getElementById('balance').innerText=balance.toFixed(2);
const h=document.getElementById('history');
h.innerHTML='<strong>История операций</strong>';
operations.forEach((o,i)=>{
const d=document.createElement('div');d.className='item';
d.innerHTML=`<div class="row"><div class="dot" style="background:${o.color}"></div>${o.category}</div>
<div class="${o.type==='income'?'plus':'minus'}">${o.type==='income'?'+':'-'}${o.amount} ₽</div>
<div class="delete" onclick="del(${i})">✕</div>`;
h.appendChild(d);
})
}

function openAdd(t){
currentType=t;currentCategory=null;
document.getElementById('addTitle').innerText=t==='income'?'Добавить доход':'Добавить расход';
const c=document.getElementById('cats');c.innerHTML='';
const src=t==='income'?incomeCategories:expenseCategories;
Object.keys(src).forEach(n=>{
const d=document.createElement('div');d.className='cat';d.style.background=src[n];d.innerText=n;
d.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));d.classList.add('active');currentCategory={name:n,color:src[n]}};
c.appendChild(d);
});
document.getElementById('addModal').style.display='flex';
}

function closeAdd(){document.getElementById('addModal').style.display='none'}
function openMenu(){document.getElementById('menuModal').style.display='flex'}
function closeMenu(){document.getElementById('menuModal').style.display='none'}

function saveOperation(){
const a=parseFloat(document.getElementById('amountInput').value);
if(!a||!currentCategory)return;
currentType==='income'?balance+=a:balance-=a;
operations.unshift({type:currentType,amount:a.toFixed(2),category:currentCategory.name,color:currentCategory.color});
save();closeAdd();render();
}

function del(i){
const o=operations[i];
o.type==='income'?balance-=parseFloat(o.amount):balance+=parseFloat(o.amount);
operations.splice(i,1);save();render();
}

function clearAll(){
if(!confirm('Удалить все данные?'))return;
balance=0;operations=[];save();closeMenu();render();
}

render();
</script>
</body>
</html>
